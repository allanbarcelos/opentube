# Implantação em uma máquina só. Sobe com:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# O compose de desenvolvimento continua sendo a base: este arquivo acrescenta a aplicação, o
# worker e o servidor da frente, e tira as portas de banco e storage do alcance externo.

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${OPENTUBE_DB_PASSWORD:?defina OPENTUBE_DB_PASSWORD}

  minio:
    ports: []
    environment:
      MINIO_ROOT_PASSWORD: ${OPENTUBE_S3_SECRET:?defina OPENTUBE_S3_SECRET}

  mailpit:
    profiles: ["desenvolvimento"]

  app:
    build:
      context: .
      dockerfile: src/OpenTube.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=opentube;Username=opentube;Password=${OPENTUBE_DB_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: opentube
      Storage__SecretKey: ${OPENTUBE_S3_SECRET}
      Storage__SegmentAuthorization: "true"
      Security__TokenPepper: ${OPENTUBE_TOKEN_PEPPER:?defina OPENTUBE_TOKEN_PEPPER}
      Security__IpHashPepper: ${OPENTUBE_IP_PEPPER:?defina OPENTUBE_IP_PEPPER}
      Security__PublicUrl: https://${OPENTUBE_HOST}
      Security__AdminEmails__0: ${OPENTUBE_ADMIN_EMAIL:?defina OPENTUBE_ADMIN_EMAIL}
      Smtp__Host: ${OPENTUBE_SMTP_HOST}
      Smtp__Port: ${OPENTUBE_SMTP_PORT:-587}
      Smtp__Username: ${OPENTUBE_SMTP_USER}
      Smtp__Password: ${OPENTUBE_SMTP_PASSWORD}
      Smtp__From: ${OPENTUBE_SMTP_FROM}
      Smtp__UseStartTls: "true"

  worker:
    build:
      context: .
      dockerfile: src/OpenTube.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=opentube;Username=opentube;Password=${OPENTUBE_DB_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: opentube
      Storage__SecretKey: ${OPENTUBE_S3_SECRET}
      Security__TokenPepper: ${OPENTUBE_TOKEN_PEPPER}
      Security__IpHashPepper: ${OPENTUBE_IP_PEPPER}
      Transcription__Executable: ${OPENTUBE_WHISPER_PATH:-}
      Transcription__ModelPath: ${OPENTUBE_WHISPER_MODEL:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENTUBE_HOST: ${OPENTUBE_HOST:?defina OPENTUBE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
