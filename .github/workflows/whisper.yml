name: Whisper

# Imagem do servidor de transcrição, em duas variantes: cpu (padrão) e cuda (GPU NVIDIA).
# Só muda quando a versão do whisper.cpp ou o entrypoint mudam, então roda só nesses casos.

on:
  push:
    branches: [main]
    paths:
      - "docker/whisper/**"
      - ".github/workflows/whisper.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/whisper/**"
      - ".github/workflows/whisper.yml"
  workflow_dispatch:

jobs:
  check:
    name: Entrypoint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck docker/whisper/entrypoint.sh scripts/whisper.sh

  build:
    name: Build & push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [check]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]

    steps:
      - uses: actions/checkout@v4

      # A imagem CUDA de compilação passa de 10 GB; o runner padrão não tem espaço sobrando.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: whisper.cpp version
        id: version
        run: echo "whisper=$(grep -m1 '^ARG WHISPER_VERSION=' docker/whisper/Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/whisper
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}-${{ steps.version.outputs.whisper }}
            type=sha,prefix=${{ matrix.variant }}-

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/whisper/Dockerfile
          target: ${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=whisper-${{ matrix.variant }}
          cache-to: type=gha,scope=whisper-${{ matrix.variant }},mode=max

      # A imagem de CPU sobe de verdade: escolhe o modelo, baixa, confere e responde.
      - name: Smoke test
        if: matrix.variant == 'cpu' && github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/whisper:cpu"
          docker run -d --name whisper -e WHISPER_MODEL=base-q5_1 -p 8080:8080 "$IMAGE"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/info.json
          docker logs whisper
