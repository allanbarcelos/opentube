name: Whisper

# Transcription server image, in two variants: cpu (default) and cuda (NVIDIA GPU).
# It only changes when docker/whisper/ changes (whisper.cpp version, entrypoint,
# model table). Editing this workflow or the dev script runs only the checks; the
# CUDA build is the most expensive one in the repository, so it is never spent on that.

on:
  push:
    branches: [main]
    paths:
      - "docker/whisper/**"
      - "scripts/whisper.sh"
      - ".github/workflows/whisper.yml"
      - ".github/scripts/changed.sh"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "docker/whisper/**"
      - "scripts/whisper.sh"
      - ".github/workflows/whisper.yml"
      - ".github/scripts/changed.sh"
      - "!**/*.md"
  # Builds and publishes regardless of what changed (for instance, to republish).
  workflow_dispatch:

env:
  IMAGE_PATHS: docker/whisper

jobs:
  check:
    name: Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck docker/whisper/entrypoint.sh scripts/whisper.sh .github/scripts/changed.sh

  changes:
    name: Image inputs changed?
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the base
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE=true
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            IMAGE=$(bash .github/scripts/changed.sh "$BASE" "$IMAGE_PATHS")
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$IMAGE" = "true" ]; then
            echo "Whisper image inputs changed: building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docker/whisper/ did not change: image build skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build & push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.image == 'true'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]

    steps:
      - uses: actions/checkout@v4

      # A imagem CUDA de compilação passa de 10 GB; o runner padrão não tem espaço sobrando.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: whisper.cpp version
        id: version
        run: echo "whisper=$(grep -m1 '^ARG WHISPER_VERSION=' docker/whisper/Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/whisper
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}-${{ steps.version.outputs.whisper }}
            type=sha,prefix=${{ matrix.variant }}-

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/whisper/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=whisper-${{ matrix.variant }}
          cache-to: type=gha,scope=whisper-${{ matrix.variant }},mode=max

      # A imagem de CPU sobe de verdade: escolhe o modelo, baixa, confere e responde.
      - name: Smoke test
        if: matrix.variant == 'cpu' && github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/whisper:cpu"
          docker run -d --name whisper -e WHISPER_MODEL=base-q5_1 -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/info.json
          docker logs whisper
