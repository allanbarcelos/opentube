name: Worker

# Tests run whenever something the worker's tests compile changes. The image is
# built only when something that goes into it changes — see IMAGE_PATHS. Markdown
# never counts, and neither do install.sh or the web app's own code.

on:
  # Gera a imagem da última versão sem esperar uma mudança de código.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/OpenTube.Worker/**"
      - "src/OpenTube.Domain/**"
      - "src/OpenTube.Infrastructure/**"
      - "src/OpenTube.Shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".dockerignore"
      - "scripts/swarm-entrypoint.sh"
      - "tests/OpenTube.Worker.Tests/**"
      - "tests/OpenTube.TestSupport/**"
      - ".github/workflows/worker.yml"
      - ".github/scripts/bump-version.sh"
      - ".github/scripts/changed.sh"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "src/OpenTube.Worker/**"
      - "src/OpenTube.Domain/**"
      - "src/OpenTube.Infrastructure/**"
      - "src/OpenTube.Shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".dockerignore"
      - "scripts/swarm-entrypoint.sh"
      - "tests/OpenTube.Worker.Tests/**"
      - "tests/OpenTube.TestSupport/**"
      - ".github/workflows/worker.yml"
      - ".github/scripts/bump-version.sh"
      - ".github/scripts/changed.sh"
      - "!**/*.md"

env:
  # What the worker image is built from. Also used to compute the version and the release notes.
  IMAGE_PATHS: >-
    src/OpenTube.Worker src/OpenTube.Domain src/OpenTube.Infrastructure src/OpenTube.Shared
    Directory.Build.props Directory.Packages.props .dockerignore scripts/swarm-entrypoint.sh

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: dotnet test tests/OpenTube.Worker.Tests/OpenTube.Worker.Tests.csproj --configuration Release

  changes:
    name: Image inputs changed?
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.filter.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the previous push
        id: filter
        run: |
          IMAGE=false
          if [ -n "${{ github.event.before }}" ]; then
            # shellcheck disable=SC2086
            IMAGE=$(bash .github/scripts/changed.sh "${{ github.event.before }}" $IMAGE_PATHS)
          fi
          # Uma versão marcada sem imagem publicada — criada à mão, ou de um envio que falhou
          # depois da tag — também precisa da imagem, ainda que o código não tenha mudado.
          if [ "$IMAGE" != "true" ]; then
            TAG_ATUAL=$(git tag -l "worker-v*" --sort=-v:refname | head -1)
            if [ -n "$TAG_ATUAL" ] && ! docker manifest inspect "ghcr.io/${{ github.repository }}/worker:${TAG_ATUAL#worker-v}" > /dev/null 2>&1; then
              IMAGE=true
              echo "No image published yet for $TAG_ATUAL." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE=true
            echo "Manual run: building." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$IMAGE" = "true" ]; then
            echo "Worker image inputs changed: building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No worker image input changed (only tests, docs, or CI): image build skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next worker version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          NEW_TAG=$(bash .github/scripts/bump-version.sh worker $IMAGE_PATHS)
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_TAG" ]; then
            CURRENT_TAG=$(git tag -l "worker-v*" --sort=-v:refname | head -1)
            DOCKER_TAG="${CURRENT_TAG#worker-v}"
          else
            CURRENT_TAG="$NEW_TAG"
            DOCKER_TAG="${NEW_TAG#worker-v}"
          fi
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ steps.version.outputs.docker_tag }},enable=${{ steps.version.outputs.docker_tag != '' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/OpenTube.Worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          # A imagem de uma versão já marcada pode sair depois; a release dela, uma vez só.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          PREV=$(git tag -l "worker-v*" --sort=-v:refname | grep -vx "$TAG" | head -1)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          # shellcheck disable=SC2086
          NOTES=$(git log "$RANGE" --no-merges --format='- %s' -- $IMAGE_PATHS)
          [ -z "$NOTES" ] && NOTES="- Maintenance."
          printf '%s\n' "$NOTES" | gh release create "$TAG" --title "Worker $TAG" --notes-file -
