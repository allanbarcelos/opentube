name: App

on:
  push:
    branches: [main]
    paths:
      - "src/OpenTube.Web/**"
      - "src/OpenTube.Domain/**"
      - "src/OpenTube.Infrastructure/**"
      - "src/OpenTube.Shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "scripts/swarm-entrypoint.sh"
      - "tests/OpenTube.Domain.Tests/**"
      - "tests/OpenTube.Infrastructure.Tests/**"
      - "tests/OpenTube.Web.Tests/**"
      - "tests/OpenTube.TestSupport/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/bump-version.sh"
  pull_request:
    branches: [main]
    paths:
      - "src/OpenTube.Web/**"
      - "src/OpenTube.Domain/**"
      - "src/OpenTube.Infrastructure/**"
      - "src/OpenTube.Shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "scripts/swarm-entrypoint.sh"
      - "tests/OpenTube.Domain.Tests/**"
      - "tests/OpenTube.Web.Tests/**"
      - "tests/OpenTube.Infrastructure.Tests/**"
      - "tests/OpenTube.TestSupport/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/bump-version.sh"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: |
          dotnet test tests/OpenTube.Domain.Tests/OpenTube.Domain.Tests.csproj --configuration Release
          dotnet test tests/OpenTube.Infrastructure.Tests/OpenTube.Infrastructure.Tests.csproj --configuration Release
          dotnet test tests/OpenTube.Web.Tests/OpenTube.Web.Tests.csproj --configuration Release

  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next app version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG=$(bash .github/scripts/bump-version.sh app \
            src/OpenTube.Web src/OpenTube.Domain src/OpenTube.Infrastructure src/OpenTube.Shared \
            Directory.Build.props Directory.Packages.props scripts/swarm-entrypoint.sh)
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_TAG" ]; then
            CURRENT_TAG=$(git tag -l "app-v*" --sort=-v:refname | head -1)
            DOCKER_TAG="${CURRENT_TAG#app-v}"
          else
            DOCKER_TAG="${NEW_TAG#app-v}"
          fi
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ steps.version.outputs.docker_tag }},enable=${{ steps.version.outputs.docker_tag != '' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/OpenTube.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV=$(git tag -l "app-v*" --sort=-v:refname | grep -vx "$TAG" | head -1)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          NOTES=$(git log "$RANGE" --no-merges --format='- %s' -- \
            src/OpenTube.Web src/OpenTube.Domain src/OpenTube.Infrastructure src/OpenTube.Shared \
            Directory.Build.props Directory.Packages.props scripts/swarm-entrypoint.sh)
          [ -z "$NOTES" ] && NOTES="- Maintenance."
          printf '%s\n' "$NOTES" | gh release create "$TAG" --title "App $TAG" --notes-file -
