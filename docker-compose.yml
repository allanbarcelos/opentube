services:
  postgres:
    image: postgres:17-alpine
    container_name: opentube-postgres
    environment:
      POSTGRES_USER: opentube
      POSTGRES_PASSWORD: opentube
      POSTGRES_DB: opentube
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentube -d opentube"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A MinIO retirou as imagens públicas do Docker Hub e do quay.io; esta é a última
  # versão comunitária publicada. Em produção, use o registro oficial com credenciais
  # ou troque por outro servidor compatível com S3 — a aplicação fala apenas a API S3.
  minio:
    image: bitnamilegacy/minio:latest
    container_name: opentube-minio
    environment:
      MINIO_ROOT_USER: opentube
      MINIO_ROOT_PASSWORD: opentube123
      MINIO_DEFAULT_BUCKETS: originals,vod
      MINIO_SCHEME: http
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: opentube-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
