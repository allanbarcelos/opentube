# Pilha local. Usuário, senha e chaves vêm do .env gerado por `make` — este arquivo
# não tem valor padrão de propósito. Sem o .env o compose recusa subir.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?rode make para gerar o .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode make para gerar o .env}
      POSTGRES_DB: ${POSTGRES_DB:?rode make para gerar o .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # A MinIO retirou as imagens públicas do Docker Hub e do quay.io; esta é a última
  # versão comunitária publicada (2025.5.24). Em produção o instalador usa a mesma imagem.
  # Presa pelo digest: o namespace bitnamilegacy não é mais mantido, e um "latest" publicado
  # depois ali entraria em toda instalação no próximo update sem ninguém revisar.
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?rode make para gerar o .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?rode make para gerar o .env}
      MINIO_SCHEME: http
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    # Só nesta máquina: o Mailpit mostra os códigos de acesso de todo mundo, inclusive do
    # administrador. Publicado em todas as interfaces, qualquer um na rede entraria.
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  app:
    build:
      context: .
      dockerfile: src/OpenTube.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__PublicEndpoint: https://${OPENTUBE_HOST:-localhost}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__SegmentAuthorization: "true"
      Security__TokenPepper: ${TOKEN_PEPPER:?rode make para gerar o .env}
      Security__IpHashPepper: ${IP_HASH_PEPPER:?rode make para gerar o .env}
      Security__PublicUrl: https://${OPENTUBE_HOST:-localhost}
      # Sem ao menos um administrador ninguém alcança a área administrativa. Na instalação
      # por Swarm quem pergunta é o install.sh; aqui vem do .env.
      Security__AdminEmails__0: ${OPENTUBE_ADMIN_EMAIL:?defina OPENTUBE_ADMIN_EMAIL no .env}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: src/OpenTube.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Security__TokenPepper: ${TOKEN_PEPPER}
      Security__IpHashPepper: ${IP_HASH_PEPPER}
      # Sem o container do Whisper no ar, o worker informa a transcrição como indisponível
      # e a aplicação esconde o botão de legenda automática.
      Transcription__ServerUrl: http://whisper:8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Legendas automáticas. Opcional, porque a compilação demora: docker compose --profile whisper up
  # Em máquina com GPU NVIDIA, troque o target para cuda e reserve a GPU (deploy.resources).
  whisper:
    profiles: [whisper]
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
      target: cpu
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-auto}
    volumes:
      - whisper-models:/models

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENTUBE_HOST: ${OPENTUBE_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
  whisper-models:
